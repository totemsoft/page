# https://docs.spring.io/spring-boot/docs/current/reference/html/appendix-application-properties.html

logging:
  level:
    com.totemsoft.page: DEBUG
    #org.springframework.boot.autoconfigure: DEBUG

management:
  endpoints:
    access:
      default: false

spring:
  application:
    name: Page Builder
  devtools:
    add-properties: false
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: none # disable automatic DDL generation to avoid conflicts
    open-in-view: false
#    properties:
#    - hibernate.bytecode.provider: none
#    - hibernate.enhancer.enableDirtyTracking: false
#    - hibernate.enhancer.enableLazyInitialization: false
  main:
    lazy-initialization: true
  messages:
    basename: messages
  # For non-embedded databases explicitly enable initialization (schema.sql, data.sql)
  #sql.init.mode: always
  web:
    resources:
      cache:
        period: 15
        cachecontrol:
          cache-private: true
          max-age: 1d
          must-revalidate: true
          no-cache: true

# --------------------------------------------------------- #
# EMBEDDED SERVER CONFIGURATION (ServerProperties)
# --------------------------------------------------------- #
server:
  port: 8080
  servlet:
    context-path: /
    application-display-name: Page Builder
