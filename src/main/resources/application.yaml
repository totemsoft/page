# https://docs.spring.io/spring-boot/docs/current/reference/html/appendix-application-properties.html

# --------------------------------------------------------- #
# IDENTITY (ContextIdApplicationContextInitializer)
# --------------------------------------------------------- #
spring:
  application:
    name: Page Builder
  jackson:
    default-property-inclusion: non_null
  jpa:
    # disable automatic DDL generation to avoid conflicts
    hibernate.ddl-auto: none
    open-in-view: false
  messages:
    basename: messages
  # For non-embedded databases explicitly enable initialization (schema.sql, data.sql)
  sql.init.mode: always

# --------------------------------------------------------- #
# EMBEDDED SERVER CONFIGURATION (ServerProperties)
# --------------------------------------------------------- #
server:
  port: 8080
  servlet:
    context-path: /
    application-display-name: Page Builder
