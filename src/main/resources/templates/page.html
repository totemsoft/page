<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title th:text="#{page.title}">TBD</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link type="text/css" rel="stylesheet" href="/css/yui-combine.css" />
    <link type="text/css" rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />
    <script type="text/javascript" src="/js/yui/yui-combine.js"></script>
    <script type="text/javascript" src="/js/default.js"></script>
    <script type="text/javascript" th:src="@{/js/admin.js}" sec:authorize="hasRole('ROLE_ADMIN')"></script>
    <script type="text/javascript" th:src="@{/js/setup.js}" sec:authorize="hasRole('ROLE_SETUP')"></script>
    <style type="text/css">
        .bold { font-weight: bold !important; }
        .italic { font-style: italic !important; }
        .wrap { white-space: normal !important; }
        .nowrap { white-space: nowrap !important; }
        .left { text-align: left !important; }
        .center { text-align: center !important; }
        .right { text-align: right !important; }
        .float-right { float: right !important; }
        .hidden { display: none !important; }
        .table-container {
            display: table;
            width: 100%;
        }
        .table-container div {
            display: table-row;
        }
        .table-container div div {
            display: table-cell;
            padding: 4px;
        }
        /* revert change from: yui-combine.css:21 */
        h2 {
            font-size: 1.5em;
            margin-block-start: 0.83em;
            margin-block-end: 0.83em;
            font-weight: bold;
        }
        .yui-dt-data .page-tag {
            background: transparent url(../js/yui/assets/skins/sam/sprite.png) repeat-x scroll 0 -200px;
            white-space: nowrap;
        }
        th.add div.yui-dt-liner span.yui-dt-label {
            background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAACXBIWXMAAAsTAAALEwEAmpwYAAAABGdBTUEAANjr9RwUqgAAACBjSFJNAABuJwAAc68AAPY3AACApQAAcCMAAN0CAAAwPgAAFrLOXXcKAAACp0lEQVR42mJhQAfTGRIYGBnigSwHNJkDDP8ZFjJkMixAFgQIIEY4azKDAgMTw3o1aSkDJ11tBl05WYZ///4x/P37F4wvPXzEcPjGTYZ7L19fYPjHEMiQy/AApA0ggCAGTARqZmQ4H2ZnKeCkpwPWsPX8eYZjV+4zMPxhYDBVk2Fw1tMEi5+5+4Bh/alzH4CuMWTIZ3gAEEBMYAP+MqxPcHaAa/7y4wdY8/0oII67z7D7zBWwOMhF+nLSDO66WgIgPSCtAAHExNDNkKAmJWVgoakKV/Tk9RsGA0EDBgF2ATAGKoZ7B0SbKMkxyAkJGYD0AgQQE1Ay3slQGy4J8fM/sCY4AHoDWR5EGyvJgNTEAwQQC5Bw0FWSZWjfsIHhyZt3EI1ADQ6SDigGNMzYzMDwG8IWE+RliA02Bql1AAggFk5WNoizgZr/Z/xnwAb+16GKKzYqMrx4+QlsGUAAMXEys4GdheJkQgAUJiBvAl0DEEAs7959ARsgxSfAYLjIkEGAFRJoBqIGDP3u/WD1jjMdIRYA8YcvHxi+/HvNICQkAeYDBBAoDA5cuv7IIc/HFRj67xi+ff/B8OzVB4YLTy8gkuCtAwxhPgZgWyVZmBishXQZ7j5+CzLgAEAAgWJh4eGTN8GuEBfgZZATEwLTIOchB6K0JB+DlCQv0GYOcJhduvYCZMBCgAACpYMF9+6/vnDk5C14FIkIcDNceHyB4cP3D2AMi0aY/IWrzxmevfh8AaQXIIBYwDYA0/b2XVfO//vzT8DEUI6BjZWZQVtTEBzaHz5/YDA3lkVovvyc4fiZxx+A+SYQpBUggBCZKQeYH/4zrJeTETIwNpRhUFIUQslMd++9Zbh05QXEZkag5imQzAQQQIwYUZQJzM7/cWRnRmB2no6anQECDACUOEgI33Q+wQAAAABJRU5ErkJggg%3D%3D") no-repeat scroll left center transparent;
            /**background: url("css/assets/add.png") no-repeat scroll left center transparent;*/
            margin-left: auto;
            margin-right: auto;
            cursor: pointer;
            display: block;
            height: 16px;
            width: 16px;
        }
        .yui-skin-sam .yui-panel .bd { padding: inherit; }
        .yui-skin-sam .yui-dt table { width:100%; }
        /* copy from: .yui-skin-sam .yui-panel .hd */
        .yui-skin-sam .yui-dt caption {
            padding: 0 10px;
            font-size: 93%;
            line-height: 2;
            font-weight: bold;
            background: url(../js/yui/assets/skins/sam/sprite.png) repeat-x 0 -200px;
        }
        .yui-skin-sam .yui-ac-input {
            position: inherit;
        }
    </style>
</head>
<body class="yui-skin-sam">
    <div id="pageMenu">
        <div class="bd">
            <ul class="first-of-type">
                <li class="yuimenuitem">
                    <a class="yuimenuitemlabel" href="#pages">
                        Pages
                    </a>
                    <div id="pages" class="yuimenu">
                        <div class="bd">
                            <ul>
                                <li th:each="page: ${pages}" th:id="|menu.${page.id}|" class="yuimenuitem">
                                    <a th:href="|/page?pageId=${page.id}|" class="yuimenuitemlabel">
                                        <em th:text="${page.name}"></em>
                                    </a>
                                </li>
                            </ul>
                            <ul sec:authorize="hasRole('ROLE_ADMIN')">
                                <li class="yuimenuitem">
                                    <a href="javascript:YAHOO.page.admin.addPage();" class="yuimenuitemlabel">
                                        <em>Add Page</em>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </li>
                <li sec:authorize="hasRole('ROLE_SETUP')" class="yuimenuitem">
                    <a class="yuimenuitemlabel" href="#setup">
                        Setup
                    </a>
                    <div id="setup" class="yuimenu">
                        <div class="bd">
                            <ul>
                                <li class="yuimenuitem">
                                    <a href="javascript:YAHOO.page.setup.editTagTypes();" class="yuimenuitemlabel">
                                        <em>Edit Tag Types</em>
                                    </a>
                                </li>
                                <li class="yuimenuitem">
                                    <a href="javascript:YAHOO.page.setup.editTags();" class="yuimenuitemlabel">
                                        <em>Edit Tags</em>
                                    </a>
                                </li>
                                <li class="yuimenuitem">
                                    <a href="javascript:YAHOO.page.setup.editKeys();" class="yuimenuitemlabel">
                                        <em>Edit Keys</em>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </li>
                <li class="yuimenuitem float-right">
                    <form id="logoutForm" action="/logout" method="post">
                        <button id="logoutButton" type="submit" class="btn btn-info btn-sm">
                            <span class="glyphicon glyphicon-log-out"></span>
                            <span th:remove="tag" th:text="#{logout.title}">TBD</span>
                        </button>
                    </form>
                </li>
           </ul>
        </div>
    </div>

    <div class="yui-gb">
        <div class="yui-u first">
            <input type="hidden" id="pageId" th:value="${page.id}" />
            <h2 th:id="|page.${page.id}|" th:text="${page.name}">TBD</h2>
        </div>
        <div class="yui-u">
            <label for="pageDate" class="bold">Select a date:</label>
            <input type="date" id="pageDate" th:value="${pageDate}" style="margin-block-start:2em;" />
        </div>
        <div class="yui-u" th:fragment="logout" sec:authorize="isAuthenticated()">
            <div class="yui-g" style="width: 100%;">
                <div class="yui-u first">
                    
                </div>
                <div class="yui-u">
                    <div class="center" th:inline="text">
                        <span class="bold">User: </span>
                        <span sec:authorize="!hasAuthority('OIDC_USER')" th:remove="tag" sec:authentication="name">TBD</span>
                        <span sec:authorize="hasAuthority('OIDC_USER')" th:remove="tag" sec:authentication="principal.attributes['email']">TBD</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="pageDiv" class="yui-navset">
        <ul class="yui-nav">
            <li th:each="tab: ${page.tabs}" th:id="|tab-menu.${tab.id}|">
                <a th:href="|#tab.${tab.id}|">
                    <em th:text="${tab.name}"></em>
                </a>
            </li>
        </ul>

        <div class="yui-content">
            <div th:each="tab: ${page.tabs}" th:id="|tab.${tab.id}|">
                <input type="hidden" th:id="|tab.index.${tab.id}|" th:value="${tab.index}" />
                <div th:each="s: ${tab.sections}"
                     th:with="sectionId=${s.id}"
                     th:id="|section.${sectionId}|">
                    <input type="hidden" th:id="|section.index.${sectionId}|" th:value="${s.index}" />
                    <input type="hidden" th:id="|section.splitRatio.${sectionId}|" th:value="${s.splitRatio.name}" />
                    <div class="hd" th:id="|section-menu.${sectionId}|" th:text="${s.name}"></div>
                    <div th:class="|bd ${s.splitRatio.cssClass}|" th:id="|bd.section.${sectionId}|"
                         th:if="${s.splitRatio.name != 'QUATER'}">
                        <div th:each="ss, iterStat: ${s.subSections}"
                             th:class="${iterStat.first}? 'yui-u first' : 'yui-u'"
                             th:with="id=${ss.id},name=${ss.name},index=${ss.index},rowTagTypeId=${ss.rowTagTypeId},columnTagTypeId=${ss.columnTagTypeId}"
                             th:id="|subSection.${id}|"
                             th:insert="~{ ::subSectionFragment(${sectionId}, ${id}, ${name}, ${index}, ${rowTagTypeId}, ${columnTagTypeId}) }">
                        </div>
                    </div>
                    <div th:class="|bd ${s.splitRatio.cssClass}|" th:id="|bd.section.${sectionId}|"
                         th:if="${s.splitRatio.name == 'QUATER'}"
                         th:with="size=${s.subSections.size()}">
                        <div class="yui-g first">
                            <div class="yui-u first" th:if="${size > 0}"
                                 th:with="ss=${s.subSections[0]},id=${ss.id},name=${ss.name},index=${ss.index},rowTagTypeId=${ss.rowTagTypeId},columnTagTypeId=${ss.columnTagTypeId}"
                                 th:id="|subSection.${id}|"
                                 th:insert="~{ ::subSectionFragment(${sectionId}, ${id}, ${name}, ${index}, ${rowTagTypeId}, ${columnTagTypeId}) }">
                            </div>
                            <div class="yui-u" th:if="${size > 1}"
                                 th:with="ss=${s.subSections[1]},id=${ss.id},name=${ss.name},index=${ss.index},rowTagTypeId=${ss.rowTagTypeId},columnTagTypeId=${ss.columnTagTypeId}"
                                 th:id="|subSection.${id}|"
                                 th:insert="~{ ::subSectionFragment(${sectionId}, ${id}, ${name}, ${index}, ${rowTagTypeId}, ${columnTagTypeId}) }">
                            </div>
                        </div>
                        <div class="yui-g" th:if="${size > 2}">
                            <div class="yui-u first" th:if="${size > 2}"
                                 th:with="ss=${s.subSections[2]},id=${ss.id},name=${ss.name},index=${ss.index},rowTagTypeId=${ss.rowTagTypeId},columnTagTypeId=${ss.columnTagTypeId}"
                                 th:id="|subSection.${id}|"
                                 th:insert="~{ ::subSectionFragment(${sectionId}, ${id}, ${name}, ${index}, ${rowTagTypeId}, ${columnTagTypeId}) }">
                            </div>
                            <div class="yui-u" th:if="${size > 3}"
                                 th:with="ss=${s.subSections[3]},id=${ss.id},name=${ss.name},index=${ss.index},rowTagTypeId=${ss.rowTagTypeId},columnTagTypeId=${ss.columnTagTypeId}"
                                 th:id="|subSection.${id}|"
                                 th:insert="~{ ::subSectionFragment(${sectionId}, ${id}, ${name}, ${index}, ${rowTagTypeId}, ${columnTagTypeId}) }">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="fragments" class="hidden">
        <div th:fragment="selectTagTypeFragment(selectId)">
            <select th:id="${selectId}">
                <option value="" th:text="#{option.null}"></option>
                <option th:each="item: ${tagTypes}" th:value="${item.id}" th:text="${item.name}"></option>
            </select>
        </div>
        <div th:fragment="subSectionFragment(sectionId, id, name, index, rowTagTypeId, columnTagTypeId)">
            <input type="hidden" th:id="|subSection.sectionId.${id}|" th:value="${sectionId}" />
            <input type="hidden" th:id="|subSection.index.${id}|" th:value="${index}" />
            <input type="hidden" th:id="|subSection.rowTagTypeId.${id}|" th:value="${rowTagTypeId}" />
            <input type="hidden" th:id="|subSection.columnTagTypeId.${id}|" th:value="${columnTagTypeId}" />
            <div class="hd" th:id="|hd.subSection.${id}|" th:text="${name}"></div>
            <div class="bd" th:id="|bd.subSection.${id}|">
                <div th:id="|data.subSection.${id}|"></div>
            </div>
        </div>
    </div>

    <div th:insert="~{admin :: admin(splitRatios=${splitRatios})}" sec:authorize="hasRole('ROLE_ADMIN')" class="hidden"></div>
    <div th:insert="~{setup :: setup()}" sec:authorize="hasRole('ROLE_SETUP')" class="hidden"></div>
</body>
</html>
