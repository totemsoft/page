<!DOCTYPE HTML>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{login.title}">TBD</title>
    <style type="text/css">
        #custom-doc {
            margin: auto;
            text-align: left;
            width: 30em;
            min-width: 300px;
        }
        .bold { font-weight:bold; }
        .italic { font-style:italic; }
        .error { color: red; }
        .float-right { float: right !important; }
        input[type=text],
        input[type=password] {
          width: 100%;
          padding: 12px 20px;
          margin: 8px 0;
          display: inline-block;
          border: 1px solid #ccc;
          box-sizing: border-box;
        }
        input[type=submit] {
          background-color: #04AA6D;
          color: white;
          padding: 14px 20px;
          margin: 8px 0;
          border: none;
          cursor: pointer;
          width: 100%;
        }
        input[type=submit]:hover {
          opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="custom-doc">
        <h1 th:text="#{login.welcome}">TBD</h1>

        <div th:if="${param.error}" class="error" th:text="#{login.error}"></div>
        <div th:if="${param.logout}" class="warning" th:text="#{login.logout}"></div>

        <form th:action="@{/login}" method="post">
            <div>
                <label for="username" th:text="#{login.username.label}" class="bold">TBD</label>
                <input type="text" th:placeholder="#{login.username.placeholder}" name="username" value="admin@company.com"/>
            </div>
            <div>
                <label for="password" th:text="#{login.password.label}" class="bold">TBD</label>
                <input type="password" th:placeholder="#{login.password.placeholder}" name="password" value="Passw0rd"/>
            </div>
            <div>
                <input type="checkbox" checked="checked" name="remember" />
                <label for="remember" th:text="#{login.remember}">TBD</label>
            </div>
            <div>
                <input type="submit" th:value="#{login.submit}" />
            </div>
        </form>

        <div th:if="${@environment.systemEnvironment['GOOGLE_CLIENT_ID'] != null}" class="float-right">
            <a th:href="@{/oauth2/authorization/google}" >
                <img src="/css/assets/google/standard-button-blue.png" style="height: 40px;" alt="Sign in with Google" />
            </a>
        </div>
    </div>
</body>
</html>
