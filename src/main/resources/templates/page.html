<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
<head>
    <title>Getting Started: Page Builder</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link type="text/css" rel="stylesheet" href="/css/yui-combine.css" />
    <script type="text/javascript" src="/js/yui/yui-combine.js"></script>
    <script type="text/javascript" src="/js/default.js"></script>
</head>
<body class="yui-skin-sam">
    <p th:text="|Hello, ${page.id}!|" />

    <div style="float: right" th:fragment="logout" sec:authorize="isAuthenticated()">
        <div>
            <span style="font-weight:bold">User: </span><span sec:authentication="name"></span>
        </div>
        <div>
            <span style="font-weight:bold">Default Authorities: </span><span sec:authentication="principal.authorities"></span>
        </div>
        <div>
            <span style="font-weight:bold">Mapped Authorities: </span><span sec:authentication="authorities"></span>
        </div>
        <div>&nbsp;</div>
        <div style="float:right">
            <form action="#" th:action="@{/logout}" method="post">
                <input type="submit" value="Logout" />
            </form>
        </div>
    </div>
    <h1>Page Builder with Spring Security</h1>
    <div>
        You are successfully logged in <span style="font-weight:bold" th:text="${userName}"></span>
        (<span style="font-weight:bold" th:text="${preferredUsername}"></span>)
    </div>

    <div id="pageDiv" class="yui-navset">
        <ul class="yui-nav">
            <li th:each="tab: ${page.tabs}" th:id="|slot.tab.${page.id}.${tab.id}|">
                <a th:href="|#slot.page.${page.id}.${tab.id}|">
                    <em th:text="${tab.name}"></em>
                </a>
            </li>
        </ul>
        <div class="yui-content">
            <div th:each="tab: ${page.tabs}" th:id="|slot.page.${page.id}.${tab.id}|">
                <div th:each="s: ${tab.sections}" th:id="|menu.section.${s.id}|">
                    <em th:text="${s.tag.name}"></em>
                    <div th:each="ss: ${s.subSections}" th:id="|menu.subSection.${ss.id}|">
                        <em th:text="${ss.tag.name}"></em>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div>&nbsp;</div>
    <div>
        <a href="/group1" >Group1 Message</a> |
        <a href="/group2" >Group2 Message</a> |
        <a href="/Admin" >Admin Message</a> |
        <a href="/graph" >Graph Client</a> |
        <a href="/arm" >Arm Client</a> |
        <a href="/webapp/webapiA/webapiB" >Obo Client</a> |
    </div>
</body>
</html>
